<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detailed overview of proof of concept deliverable including demo video, benefits, technologies, and project team.">

    <title>PoC Details | RTA Digital Lab & 4IR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/poc.css">
    <link rel="icon" href="assets/favicon.png">
    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const theme = (savedTheme === "dark" || savedTheme === "light") ? savedTheme : (prefersDark ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>

<body>
    <div id="app">

        <!-- =====================================================
            RTA APP HEADER
        ===================================================== -->
        <header class="header">
            <div class="header-content">
                <div class="header-brand-group">
                    <a href="index.html" class="logo-link" aria-label="Go to RTA PoC Gallery home">
                        <img 
                            id="app-logo"
                            src="assets/rta-logo-color.png" 
                            alt="RTA — Roads & Transport Authority" 
                            class="logo">
                    </a>
                    <span class="header-program-badge">
                        <span class="badge-dot"></span>
                        Digital Lab · 4IR Program
                    </span>
                </div>

                <div class="header-actions">
                    <a
                        href="index.html"
                        class="btn-back"
                    >
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                            <path d="M8.5 3.5L5 7L8.5 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        Back to Gallery
                    </a>

                    <button
                        id="theme-toggle"
                        class="theme-toggle"
                        type="button"
                        aria-label="Toggle light/dark mode"
                        title="Toggle light/dark mode"
                    >
                        <span id="theme-icon">☀</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- =====================================================
            MAIN POC DETAILS
        ===================================================== -->
        <main class="poc-page">
            <div id="poc-details">
                <div class="loading-state">
                    <div class="skeleton-shimmer" style="width: 220px; height: 16px; border-radius: 999px; margin-bottom: 24px;"></div>
                    <div class="skeleton-shimmer" style="width: 60%; height: 36px; border-radius: 10px; margin-bottom: 20px;"></div>
                    <div class="skeleton-shimmer" style="width: 100%; height: 320px; border-radius: 14px;"></div>
                </div>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="app-footer">
            <div class="footer-content">
                <div class="footer-brand">
                    <img src="assets/rta-logo-color.png" alt="RTA Logo" class="footer-logo">
                    <div class="footer-text">
                        <span>Roads &amp; Transport Authority · Government of Dubai</span>
                        <span>Digital Lab &amp; Fourth Industrial Revolution (4IR) Program</span>
                    </div>
                </div>
                <div class="footer-copy">
                    Designed in accordance with the RTA PoC Design System Standards
                </div>
            </div>
        </footer>

    </div>

    <script src="js/poc.js"></script>
</body>
</html>
