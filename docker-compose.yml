services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ddl-poc-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b

    expose:
      - "8000"

    depends_on:
      redis:
        condition: service_healthy

      ollama-init:
        condition: service_completed_successfully


  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ddl-poc-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


  redis:
    image: redis:7-alpine

    container_name: ddl-poc-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  ollama:
    image: ollama/ollama:latest

    container_name: ddl-poc-ollama

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama


  ollama-init:
    image: ollama/ollama:latest

    container_name: ddl-poc-ollama-init

    depends_on:
      - ollama

    environment:
      OLLAMA_HOST: http://ollama:11434

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        echo "Waiting for Ollama..."

        until ollama list >/dev/null 2>&1; do
          sleep 2
        done

        echo "Ollama is ready."

        if ollama list | grep -q "llama3.2:1b"; then
          echo "llama3.2:1b already exists. Skipping download."
        else
          echo "llama3.2:1b not found. Pulling model..."
          ollama pull llama3.2:1b
          echo "llama3.2:1b successfully downloaded."
        fi

        if ollama list | grep -q "nomic-embed-text"; then
          echo "nomic-embed-text already exists. Skipping download."
        else
          echo "nomic-embed-text not found. Pulling model..."
          ollama pull nomic-embed-text
          echo "nomic-embed-text successfully downloaded."
        fi

    restart: "no"


volumes:

  redis_data:

  ollama_data: