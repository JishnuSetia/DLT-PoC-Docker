services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ddl-poc-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0

    expose:
      - "8000"

    depends_on:
      redis:
        condition: service_healthy


  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ddl-poc-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


  redis:
    image: redis:7-alpine

    container_name: ddl-poc-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data: