<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PoC Chat</title>

    <link rel="stylesheet" href="css/chat.css">
</head>

<body>

    <div class="chat-app">

        <!-- ========================================
             SIDEBAR
        ========================================= -->

        <aside class="chat-sidebar">

            <a
                href="index.html"
                class="back-button"
            >
                ← Back to PoCs
            </a>

            <div id="poc-info">

                <div class="poc-loading">
                    Loading PoC...
                </div>

            </div>

        </aside>


        <!-- ========================================
             CHAT
        ========================================= -->

        <main class="chat-main">

            <header class="chat-header">

                <div>

                    <span class="chat-header-label">
                        AI Assistant
                    </span>

                    <h1 id="chat-title">
                        PoC Assistant
                    </h1>

                </div>

                <span
                    id="session-status"
                    class="session-status"
                >
                    Connected
                </span>

            </header>


            <!-- Messages -->

            <div
                id="chat-messages"
                class="chat-messages"
            >

                <div class="welcome-message">

                    <h2>
                        Ask about this PoC
                    </h2>

                    <p>
                        Ask questions about the project,
                        technologies, benefits, implementation,
                        or other available information.
                    </p>

                </div>

            </div>


            <!-- Input -->

            <div class="chat-input-area">

                <form id="chat-form">

                    <textarea
                        id="chat-input"
                        placeholder="Ask something about this PoC..."
                        rows="1"
                        autocomplete="off"
                    ></textarea>

                    <button
                        id="send-button"
                        type="submit"
                    >
                        Send
                    </button>

                </form>

                <p class="chat-disclaimer">
                    AI responses are based on the available PoC information.
                </p>

            </div>

        </main>

    </div>


    <script src="js/chat.js"></script>

</body>

</html>
